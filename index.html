<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Nuestra historia</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100%;overflow:hidden}button{font:inherit}.app{height:100dvh;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#242424 0,#080808 38%,#000 72%);overflow:hidden}.screen{width:100%;height:100%;display:grid;place-items:center;text-align:center;position:relative;padding:28px 18px}.inner{width:min(680px,100%);position:relative;z-index:4}.title{font-size:clamp(30px,8vw,48px);font-weight:450;letter-spacing:-.04em}.muted{color:#999;margin-top:10px}.profiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px;margin:34px auto 0;max-width:520px}.profile{border:0;background:none;color:#aaa;cursor:pointer}.avatar{width:74px;height:74px;margin:0 auto 9px;border-radius:9px;background:linear-gradient(145deg,#393939,#111);display:grid;place-items:center;border:2px solid transparent;font-size:24px}.profile:hover,.profile:focus{color:#fff;outline:none}.profile:hover .avatar,.profile:focus .avatar{border-color:#fff}.cinema{font-family:Georgia,'Times New Roman',serif;font-size:clamp(31px,8vw,55px);line-height:1.2}.small{color:#aaa;line-height:1.65;margin-top:18px}.gold{color:#e7d0a7}.who{text-transform:uppercase;letter-spacing:.25em;color:#aaa;font-size:12px;margin-bottom:13px}.play,.back{border-radius:999px;min-height:48px;padding:0 25px;margin-top:26px;cursor:pointer}.play{border:0;background:#fff;color:#050505;font-weight:750}.back{border:1px solid #444;background:transparent;color:#aaa}.photoStage{position:absolute;inset:0;background:#000;overflow:hidden}.photoBlur{position:absolute;inset:-25px;background-size:cover;background-position:center;filter:blur(28px) brightness(.38);transform:scale(1.12)}.photoMain{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;animation:ken 4.4s ease forwards}.photoStage:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.02) 50%,rgba(0,0,0,.78))}.photoText{position:absolute;z-index:3;left:20px;right:20px;bottom:8vh;font-family:Georgia,serif;font-size:clamp(27px,7vw,45px);text-shadow:0 3px 18px #000}.revealPic{width:min(92vw,560px);height:min(68vh,720px);object-fit:contain;border-radius:16px;box-shadow:0 20px 70px #000;background:#090909}.reveal{font-family:Georgia,serif;font-size:clamp(42px,11vw,68px);line-height:1.04}.progress{position:absolute;bottom:0;left:0;height:3px;background:#e50914;z-index:10;transition:width .4s}.fade{animation:fade .85s ease both}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes ken{from{transform:scale(.98)}to{transform:scale(1.02)}}.pulse{animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.55}}.lights{height:115px;position:relative;width:300px;margin:0 auto 20px}.orb{position:absolute;top:40px;width:48px;height:48px;border-radius:50%;background:#f4d9aa;filter:blur(16px);box-shadow:0 0 65px rgba(244,217,170,.55)}.a{left:27%;animation:oa 4s forwards}.b{right:27%;animation:ob 4s forwards}@keyframes oa{to{left:42%}}@keyframes ob{to{right:42%}}@media(max-width:430px){.profiles{grid-template-columns:repeat(2,1fr)}.avatar{width:68px;height:68px}.screen{padding:22px 14px}.photoText{bottom:7vh}}</style></head><body><main class="app"><section class="screen" id="screen"></section><div class="progress" id="progress"></div></main><script>const people={Belkis:{g:'Bienvenida',r:'ABUELA'},Ana:{g:'Bienvenida',r:'ABUELA'},Genesis:{g:'Bienvenida',r:'TÍA'},Marielbys:{g:'Bienvenida',r:'TÍA'},Mercy:{g:'Bienvenida',r:'TÍA'},Elvis:{g:'Bienvenido',r:'ABUELO'},'Team Marketing':{g:'Bienvenidos',r:'TÍOS/AS',group:true},'Team Pueica':{g:'Bienvenidos',r:'TÍOS/AS',group:true},'Team Picapollo':{g:'Bienvenidos',r:'TÍOS/AS',group:true}};const photos=['assets/foto1.jpg','assets/foto2.jpg','assets/foto3.jpg','assets/foto4.jpg'];const screen=document.querySelector('#screen'),progress=document.querySelector('#progress');let selected=null,timers=[];const later=(f,t)=>timers.push(setTimeout(f,t));const clear=()=>{timers.forEach(clearTimeout);timers=[]};function wrap(h){screen.innerHTML='<div class="inner fade">'+h+'</div>'}function profiles(){clear();progress.style.width='0';wrap('<div class="title">¿Quién está viendo?</div><div class="muted">Selecciona tu perfil.</div><div class="profiles" id="profiles"></div>');const box=document.querySelector('#profiles');Object.keys(people).forEach(n=>{const b=document.createElement('button');b.className='profile';b.innerHTML='<div class="avatar">'+n[0]+'</div><div>'+n+'</div>';b.onclick=()=>welcome(n);box.appendChild(b)})}function welcome(n){selected=n;wrap('<div class="who">'+n+'</div><div class="cinema">'+people[n].g+', '+n+'.</div><div class="small">'+(people[n].group?'Pónganse cómodos…':('Ponte cómod'+(n==='Elvis'?'o':'a')+'…'))+'<br>Hay una historia que queremos que conozcas.</div><button class="play" id="play">▶ Reproducir</button><br><button class="back" id="back">Cambiar perfil</button>');play.onclick=start;back.onclick=profiles}function scene(h,p){wrap(h);progress.style.width=p+'%'}function start(){clear();scene('<div class="lights"><span class="orb a"></span><span class="orb b"></span></div><div class="cinema">Toda historia comienza<br>de alguna manera…</div>',8);later(()=>scene('<div class="cinema">La nuestra comenzó<br><span class="gold">siendo dos.</span></div>',18),3800);later(()=>photo(0,'Dos personas. Una historia.',30),7000);later(()=>photo(1,'Y muchos momentos por recordar.',42),11100);later(()=>photo(2,'Risas, aventuras…',54),15200);later(()=>photo(3,'y una vida construida juntos.',66),19300);later(change,23500)}function photo(i,text,p){const u=photos[i];screen.innerHTML='<div class="photoStage fade"><div class="photoBlur" style="background-image:url('+u+')"></div><div class="photoMain" style="background-image:url('+u+')"></div></div><div class="photoText fade">'+text+'</div>';progress.style.width=p+'%'}function change(){scene('<div class="cinema">Y sin darnos cuenta…<br><span class="gold">fuimos llenando nuestra historia de recuerdos.</span></div>',74);later(()=>scene('<div class="cinema">Pero nuestra historia<br><span class="gold">estaba a punto de cambiar.</span></div>',82),4000);later(()=>scene('<div class="cinema pulse">Y entonces…</div>',89),7600);later(reveal,10100)}function reveal(){screen.innerHTML='<div class="inner fade"><img class="revealPic" src="assets/revelacion.png" alt="Nuestra gran noticia"></div>';progress.style.width='94%';later(finalReveal,3800)}function finalReveal(){const p=people[selected];screen.innerHTML='<div class="inner fade"><div class="who">'+selected+'</div><div class="reveal">'+(p.group?'VAN A SER':'VAS A SER')+'<br><span class="gold">'+p.r+'</span> 🤍</div><div class="small">Parece que nuestra historia ya no será de dos.</div></div>';progress.style.width='98%';later(end,7000)}function end(){progress.style.width='100%';wrap('<div class="cinema">La mejor historia<br><span class="gold">apenas comienza…</span></div><div class="small" style="letter-spacing:.18em;text-transform:uppercase;margin-top:28px">Nos vemos pronto 🤍</div><button class="back" id="again">Volver a verla</button>');again.onclick=profiles}profiles();</script></body></html>
